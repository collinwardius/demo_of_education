<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annotation Directory</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: #2c3e50;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .header-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .progress {
            font-size: 14px;
            color: #ecf0f1;
        }

        .button {
            padding: 10px 18px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .button-primary {
            background: #3498db;
            color: white;
        }

        .button-primary:hover {
            background: #2980b9;
        }

        .filters {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-group label {
            font-size: 14px;
            font-weight: 600;
            color: #555;
        }

        .filter-group select {
            padding: 6px 10px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #34495e;
            color: white;
        }

        th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
        }

        tbody tr {
            border-bottom: 1px solid #e0e0e0;
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        td {
            padding: 12px;
            font-size: 14px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-annotated {
            background: #d4edda;
            color: #155724;
        }

        .status-unannotated {
            background: #fff3cd;
            color: #856404;
        }

        .status-exempt {
            background: #e2e3e5;
            color: #383d41;
        }

        .status-inherited {
            background: #d1ecf1;
            color: #0c5460;
            margin-left: 5px;
        }

        .filename {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #555;
        }

        .columns {
            font-size: 13px;
            color: #666;
        }

        .rotation {
            font-size: 13px;
            color: #666;
            font-weight: 600;
        }

        .action-link {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
        }

        .action-link:hover {
            text-decoration: underline;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .stats {
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 15px 20px;
            border-radius: 6px;
            border-left: 4px solid #3498db;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Annotation Directory</h1>
            <div class="header-controls">
                <div class="progress" id="progress">Loading...</div>
                <a href="/" class="button button-primary">Back to Annotator</a>
            </div>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label for="filterStatus">Filter:</label>
                <select id="filterStatus">
                    <option value="all">All Files</option>
                    <option value="annotated">Annotated Only</option>
                    <option value="unannotated">Unannotated Only</option>
                    <option value="inherited">Inherited Only</option>
                    <option value="exempt">Exempt Only</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="searchInput">Search:</label>
                <input type="text" id="searchInput" placeholder="Search filenames..." style="padding: 6px 10px; border: 2px solid #ddd; border-radius: 4px; width: 300px;">
            </div>
        </div>

        <div class="content">
            <div class="stats" id="stats"></div>
            <table id="imagesTable">
                <thead>
                    <tr>
                        <th style="width: 50px;">#</th>
                        <th style="width: 100px;">Status</th>
                        <th>Filename</th>
                        <th style="width: 100px;">Rotation</th>
                        <th>Column Names</th>
                        <th style="width: 100px;">Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="6" class="empty-state">Loading images...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let allImages = [];
        let currentFilter = 'all';
        let searchTerm = '';

        async function loadImages() {
            try {
                const response = await fetch('/api/images');
                const data = await response.json();
                allImages = data.images;

                updateStats(data);
                renderTable();
            } catch (error) {
                console.error('Error loading images:', error);
            }
        }

        function updateStats(data) {
            const annotatedPercent = Math.round((data.annotated_count / data.total) * 100) || 0;
            const inheritedCount = allImages.filter(img => img.annotation?.inherited_from).length;
            const exemptCount = allImages.filter(img => img.annotation?.status === 'exempt').length;
            const realAnnotatedCount = data.annotated_count - exemptCount;

            document.getElementById('progress').textContent =
                `${data.annotated_count}/${data.total} annotated (${annotatedPercent}%)`;

            document.getElementById('stats').innerHTML = `
                <div class="stat-card">
                    <div class="stat-label">Total Files</div>
                    <div class="stat-value">${data.total}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Annotated</div>
                    <div class="stat-value">${realAnnotatedCount}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Exempt</div>
                    <div class="stat-value">${exemptCount}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Remaining</div>
                    <div class="stat-value">${data.total - data.annotated_count}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Inherited</div>
                    <div class="stat-value">${inheritedCount}</div>
                </div>
            `;
        }

        function filterImages() {
            return allImages.filter(img => {
                // Filter by status
                if (currentFilter === 'annotated' && !img.annotated) return false;
                if (currentFilter === 'unannotated' && img.annotated) return false;
                if (currentFilter === 'inherited' && !img.annotation?.inherited_from) return false;
                if (currentFilter === 'exempt' && img.annotation?.status !== 'exempt') return false;

                // Filter by search term
                if (searchTerm && !img.filename.toLowerCase().includes(searchTerm.toLowerCase())) {
                    return false;
                }

                return true;
            });
        }

        function renderTable() {
            const filteredImages = filterImages();
            const tbody = document.getElementById('tableBody');

            if (filteredImages.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No images match the current filter</td></tr>';
                return;
            }

            tbody.innerHTML = filteredImages.map(img => {
                let statusBadge;
                if (img.annotation?.status === 'exempt') {
                    statusBadge = '<span class="status-badge status-exempt">⊗ Exempt</span>';
                } else if (img.annotated) {
                    statusBadge = '<span class="status-badge status-annotated">✓ Annotated</span>';
                } else {
                    statusBadge = '<span class="status-badge status-unannotated">○ Unannotated</span>';
                }

                const inheritedBadge = img.annotation?.inherited_from
                    ? '<span class="status-badge status-inherited">↑ Inherited</span>'
                    : '';

                const rotation = (img.annotation && img.annotation.status !== 'exempt')
                    ? `${img.annotation.rotation_degrees}°`
                    : '-';

                const columns = (img.annotation && img.annotation.status !== 'exempt')
                    ? img.annotation.column_names.join(', ')
                    : '-';

                return `
                    <tr>
                        <td>${img.index + 1}</td>
                        <td>${statusBadge}${inheritedBadge}</td>
                        <td class="filename">${img.filename}</td>
                        <td class="rotation">${rotation}</td>
                        <td class="columns">${columns}</td>
                        <td><a href="/?index=${img.index}" class="action-link">View/Edit</a></td>
                    </tr>
                `;
            }).join('');
        }

        // Event listeners
        document.getElementById('filterStatus').addEventListener('change', (e) => {
            currentFilter = e.target.value;
            renderTable();
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchTerm = e.target.value;
            renderTable();
        });

        // Load on page load
        window.addEventListener('DOMContentLoaded', loadImages);
    </script>
</body>
</html>
